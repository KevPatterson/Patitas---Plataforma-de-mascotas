<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patitas · Navbar rediseñado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#231942;--paper:#FFFFFF;--page:#FFF1E4;--orange:#FF7A2F;--orange-d:#E85F14;
  --mint:#38C9A3;--soft:#FFE3CC;--muted:#6B6585;
  --f-display:"Baloo 2","Trebuchet MS",sans-serif;--f-body:"DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F4EEFF;--paper:#2A2140;--page:#1B1530;--soft:#3A2D57;--muted:#B4AACF;--orange:#FF8A45;--orange-d:#FF7A2F}}
:root[data-theme="dark"]{--ink:#F4EEFF;--paper:#2A2140;--page:#1B1530;--soft:#3A2D57;--muted:#B4AACF;--orange:#FF8A45;--orange-d:#FF7A2F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--page);font-family:var(--f-body);color:var(--ink)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.nav-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:14px 16px}
.nav{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:8px;
  background:var(--paper);border:2px solid var(--ink);border-radius:22px;
  box-shadow:0 4px 0 var(--ink);padding:8px 10px 8px 16px}

.brand{display:flex;align-items:center;gap:8px;margin-right:auto;text-decoration:none;color:var(--ink);
  font:800 1.65rem/1 var(--f-display);letter-spacing:-.02em}
.brand svg{width:34px;height:34px;transition:transform .25s}
.brand:hover svg{transform:rotate(-12deg) scale(1.08)}

.links{display:flex;align-items:center;gap:4px}
.link{position:relative;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;
  font:600 .95rem var(--f-body);color:var(--muted);text-decoration:none;border:2px solid transparent;
  transition:background .15s,color .15s}
.link:hover{background:var(--soft);color:var(--ink)}
.link[aria-current="page"]{color:var(--ink);background:var(--soft);border-color:var(--ink)}
.link[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:-9px;width:10px;height:10px;
  background:var(--orange);border:2px solid var(--ink);border-radius:50%;transform:translateX(-50%)}
.dot{position:absolute;top:5px;left:26px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--mint);border:2px solid var(--ink);color:#231942;font:700 .68rem/14px var(--f-body);text-align:center}

.publish{display:flex;align-items:center;gap:8px;margin:0 8px;padding:10px 20px;border-radius:16px;
  background:var(--orange);color:#231942;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);
  font:800 1rem var(--f-display);text-decoration:none;cursor:pointer;
  transition:transform .12s,box-shadow .12s}
.publish:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.publish:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.publish .paw{width:20px;height:20px;transition:transform .3s}
.publish:hover .paw{transform:rotate(-20deg) scale(1.2)}

.me{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);font:600 .95rem var(--f-body);text-decoration:none}
.me:hover{background:var(--soft)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;border:2px solid var(--ink)}
.out{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;border:2px solid transparent;
  background:none;color:var(--muted);cursor:pointer}
.out:hover{border-color:var(--ink);color:var(--ink);background:var(--soft)}

.burger{display:none;width:44px;height:44px;place-items:center;border-radius:14px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer}

a:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

@media (max-width:900px){
  .burger{display:grid}
  .links{display:none;position:absolute;left:16px;right:16px;top:calc(100% - 6px);flex-direction:column;align-items:stretch;
    gap:6px;padding:14px;background:var(--paper);border:2px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink)}
  .nav-wrap.open .links{display:flex}
  .link,.me{justify-content:flex-start;padding:12px 14px}
  .link[aria-current="page"]::after{display:none}
  .dot{left:28px;top:8px}
  .links .publish{display:none}
  .publish{margin:0;justify-content:center}
  .out{width:auto;height:auto;padding:12px 14px;justify-content:flex-start;display:flex;gap:8px;font:600 .95rem var(--f-body)}
  .nav{position:relative}
}
@media (max-width:420px){.publish.top{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.demo{max-width:1180px;margin:40px auto;padding:0 20px;color:var(--muted)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
  <symbol id="out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="paw" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><ellipse cx="6" cy="10" rx="2" ry="2.6"/><ellipse cx="10" cy="5.8" rx="2" ry="2.8"/><ellipse cx="14.5" cy="5.8" rx="2" ry="2.8"/><ellipse cx="18.5" cy="10" rx="2" ry="2.6"/><path d="M12 11c-3 0-5.6 3.4-5.6 6 0 1.8 1.4 2.6 3 2.4 1-.1 1.8-.5 2.6-.5s1.6.4 2.6.5c1.6.2 3-.6 3-2.4 0-2.6-2.6-6-5.6-6z"/></g></symbol>
</svg>

<header class="nav-wrap" id="wrap">
  <nav class="nav" aria-label="Principal">
    <a class="brand" href="/" aria-label="Patitas, inicio">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="2" y="2" width="36" height="36" rx="12" fill="#FF7A2F" stroke="#231942" stroke-width="2.5"/>
        <g fill="#231942"><ellipse cx="11.5" cy="17" rx="2.6" ry="3.2"/><ellipse cx="17" cy="11.5" rx="2.6" ry="3.4"/><ellipse cx="23" cy="11.5" rx="2.6" ry="3.4"/><ellipse cx="28.5" cy="17" rx="2.6" ry="3.2"/><path d="M20 19c-4 0-7.5 4.4-7.5 7.8 0 2.3 1.8 3.4 3.9 3.1 1.3-.2 2.4-.7 3.6-.7s2.3.5 3.6.7c2.1.3 3.9-.8 3.9-3.1C27.5 23.4 24 19 20 19z"/></g>
      </svg>
      patitas
    </a>

    <div class="links" id="links">
      <a class="link" href="/buscar"><svg class="i"><use href="#search"/></svg>Buscar</a>
      <a class="link" href="/mapa" aria-current="page"><svg class="i"><use href="#pin"/></svg>Mapa</a>
      <a class="link" href="/notificaciones"><svg class="i"><use href="#bell"/></svg>Avisos<span class="dot" aria-label="3 sin leer">3</span></a>
      <a class="publish" href="/publicar"><svg class="i paw"><use href="#paw"/></svg>Publicar</a>
      <a class="me" href="/perfil"><span class="avatar"><svg class="i" style="width:16px;height:16px"><use href="#user"/></svg></span>Perfil</a>
      <button class="out" type="button" aria-label="Salir"><svg class="i"><use href="#out"/></svg><span class="out-t" hidden>Salir</span></button>
    </div>

    <a class="publish top" href="/publicar" style="display:none" id="pubTop"><svg class="i paw"><use href="#paw"/></svg>Publicar</a>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="links" aria-label="Abrir menú">
      <svg class="i"><use href="#menu"/></svg>
    </button>
  </nav>
</header>

<p class="demo">Vista previa: achica la ventana para ver el menú móvil.</p>

<script>
(function(){
  var wrap=document.getElementById('wrap'),b=document.getElementById('burger'),top=document.getElementById('pubTop');
  var mq=window.matchMedia('(max-width:900px)');
  function sync(){top.style.display=mq.matches?'flex':'none';
    document.querySelector('.out-t').hidden=!mq.matches;}
  sync();mq.addEventListener('change',sync);
  b.addEventListener('click',function(){
    var o=wrap.classList.toggle('open');
    b.setAttribute('aria-expanded',o);
    b.querySelector('use').setAttribute('href',o?'#x':'#menu');
  });
})();
</script>
</body>
</html>
